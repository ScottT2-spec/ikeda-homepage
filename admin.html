<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IKEDA — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --ink:#1E2A22; --line:#D9E0D4; --paper:#F7F8F5; --clay:#B5572F; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 80px;}
  h1{font-size:22px;margin:0 0 6px;}
  .sub{color:#667;font-size:13.5px;margin:0 0 28px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .card h2{font-size:15px;margin:0 0 16px;text-transform:uppercase;letter-spacing:0.04em;color:#556;}
  label{display:block;font-size:13px;color:#556;margin:14px 0 5px;}
  label:first-of-type{margin-top:0;}
  input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-family:inherit;}
  textarea{resize:vertical;}
  input[type=color]{width:52px;height:34px;padding:2px;cursor:pointer;}
  .color-row{display:flex;align-items:center;gap:10px;}
  .color-row input[type=text]{flex:1;}
  button{cursor:pointer;border:none;border-radius:4px;font-size:14px;font-weight:600;padding:11px 20px;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-save{background:var(--clay);color:#fff;position:sticky;bottom:16px;width:100%;padding:14px;font-size:15px;}
  .status{font-size:13.5px;margin-top:10px;min-height:1.2em;}
  .status[data-s="ok"]{color:#2E7D32;}
  .status[data-s="err"]{color:#C0392B;}
  #loginView{max-width:360px;margin:80px auto;}
  #appView{display:none;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .topbar a{font-size:13px;color:var(--clay);text-decoration:none;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;}
  .tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:#889;cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink);border-bottom-color:var(--clay);}
  .panel{display:none;}
  .panel.active{display:block;}

  .sub-empty{color:#889;font-size:14px;padding:20px 0;text-align:center;}
  .sub-item{border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px;}
  .sub-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .sub-badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;
    padding:3px 9px;border-radius:20px;color:#fff;}
  .sub-badge[data-type=contact]{background:#4A6FA5;}
  .sub-badge[data-type=wholesale]{background:var(--clay);}
  .sub-badge[data-type=newsletter]{background:#5C7A62;}
  .sub-date{font-size:12px;color:#889;white-space:nowrap;}
  .sub-row{font-size:14px;margin:3px 0;}
  .sub-row b{color:#556;font-weight:600;margin-right:4px;}
  .sub-del{background:none;color:#C0392B;font-size:12px;font-weight:600;padding:4px 8px;}
  .sub-filters{display:flex;gap:8px;margin-bottom:18px;}
  .sub-filters button{background:#fff;border:1px solid var(--line);color:#556;font-weight:600;padding:7px 14px;}
  .sub-filters button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
</style>
</head>
<body>

<div id="loginView" class="wrap">
  <div class="card">
    <h2>IKEDA Admin Login</h2>
    <label>Username</label><input type="text" id="loginUser" autocomplete="username">
    <label>Password</label><input type="password" id="loginPass" autocomplete="current-password">
    <button class="btn-primary" style="margin-top:18px;width:100%;" onclick="login()">Log In</button>
    <p class="status" id="loginStatus"></p>
  </div>
</div>

<div id="appView" class="wrap">
  <div class="topbar">
    <div>
      <h1>IKEDA Admin</h1>
      <p class="sub">Homepage content, form submissions, and your account — all from here.</p>
    </div>
    <a href="#" onclick="logout();return false;">Log out</a>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="content" onclick="switchTab('content')">Homepage Content</div>
    <div class="tab" data-tab="submissions" onclick="switchTab('submissions')">Submissions <span id="subCount"></span></div>
    <div class="tab" data-tab="account" onclick="switchTab('account')">Account</div>
  </div>

  <div id="panel-content" class="panel active">
    <div id="fields"></div>
    <button class="btn-save" onclick="saveAll()">Save Changes</button>
    <p class="status" id="saveStatus"></p>
  </div>

  <div id="panel-submissions" class="panel">
    <div class="sub-filters" id="subFilters">
      <button class="active" data-filter="all" onclick="setFilter('all')">All</button>
      <button data-filter="wholesale" onclick="setFilter('wholesale')">Wholesale</button>
      <button data-filter="contact" onclick="setFilter('contact')">Contact</button>
      <button data-filter="newsletter" onclick="setFilter('newsletter')">Newsletter</button>
    </div>
    <div id="subList"></div>
  </div>

  <div id="panel-account" class="panel">
    <div class="card">
      <h2>Change Password</h2>
      <label>Current Password</label><input type="password" id="curPass">
      <label>New Password (min 8 characters)</label><input type="password" id="newPass">
      <button class="btn-primary" style="margin-top:18px;" onclick="changePassword()">Update Password</button>
      <p class="status" id="pwStatus"></p>
    </div>
  </div>
</div>

<script>
const API_BASE = window.IKEDA_API_BASE || "";
let token = localStorage.getItem("ikeda-admin-token");
let allSubmissions = [];
let currentFilter = "all";

// Field definitions: key, label, input type, which section it's grouped under.
const FIELDS = [
  ["Brand", [
    ["brand.logo_text", "Logo text", "text"],
  ]],
  ["Brand Colors", [
    ["brand.color.paper", "Background", "color"],
    ["brand.color.paper2", "Background (alt)", "color"],
    ["brand.color.ink", "Text / Ink", "color"],
    ["brand.color.inkSoft", "Muted text", "color"],
    ["brand.color.clay", "Accent (buttons, links)", "color"],
    ["brand.color.moss", "Secondary accent", "color"],
    ["brand.color.line", "Hairlines / borders", "color"],
  ]],
  ["Navigation", [
    ["nav.cta_text", "Shop button text", "text"],
  ]],
  ["Hero", [
    ["hero.heading", "Heading", "text"],
    ["hero.subheading", "Subheading", "textarea"],
    ["hero.cta_text", "Button text", "text"],
    ["hero.video_url", "Background video URL", "text"],
  ]],
  ["Product Ranges — Section Intro", [
    ["lines.heading", "Heading", "text"],
    ["lines.subheading", "Subheading", "textarea"],
  ]],
  ["Product Card 1", [
    ["card1.title", "Title", "text"],
    ["card1.body", "Description", "textarea"],
    ["card1.image_url", "Image URL", "text"],
  ]],
  ["Product Card 2", [
    ["card2.title", "Title", "text"],
    ["card2.body", "Description", "textarea"],
    ["card2.image_url", "Image URL", "text"],
  ]],
  ["Product Card 3", [
    ["card3.title", "Title", "text"],
    ["card3.body", "Description", "textarea"],
    ["card3.image_url", "Image URL", "text"],
  ]],
  ["Statement Band", [
    ["statement.quote", "Quote", "textarea"],
    ["statement.attribution", "Attribution", "text"],
    ["statement.video_url", "Background video URL", "text"],
  ]],
  ["About Us", [
    ["about.heading", "Heading", "text"],
    ["about.body", "Body", "textarea"],
    ["about.image_url", "Image URL", "text"],
  ]],
  ["Our Story", [
    ["story.heading", "Heading", "text"],
    ["story.body", "Body", "textarea"],
    ["story.image_url", "Image URL", "text"],
  ]],
  ["Wholesale Form", [
    ["wholesale.heading", "Heading", "text"],
    ["wholesale.subheading", "Subheading", "textarea"],
  ]],
  ["Contact Form", [
    ["contact.heading", "Heading", "text"],
    ["contact.subheading", "Subheading", "textarea"],
  ]],
  ["Newsletter", [
    ["newsletter.heading", "Heading", "text"],
    ["newsletter.subheading", "Subheading", "textarea"],
  ]],
  ["Footer", [
    ["footer.legal", "Legal block (HTML allowed, e.g. <br>)", "textarea"],
    ["footer.copyright", "Copyright line", "text"],
  ]],
];

function renderFields(content) {
  const container = document.getElementById("fields");
  container.innerHTML = "";
  FIELDS.forEach(([section, fields]) => {
    const card = document.createElement("div");
    card.className = "card";
    const h2 = document.createElement("h2");
    h2.textContent = section;
    card.appendChild(h2);

    fields.forEach(([key, label, type]) => {
      const lbl = document.createElement("label");
      lbl.textContent = label;
      card.appendChild(lbl);

      const value = content[key] || "";
      if (type === "color") {
        const row = document.createElement("div");
        row.className = "color-row";
        row.innerHTML = `<input type="color" data-key="${key}" value="${value}">
                          <input type="text" data-key-text="${key}" value="${value}">`;
        card.appendChild(row);
        const colorInput = row.querySelector("[type=color]");
        const textInput = row.querySelector("[type=text]");
        colorInput.addEventListener("input", () => textInput.value = colorInput.value);
        textInput.addEventListener("input", () => colorInput.value = textInput.value);
      } else if (type === "textarea") {
        const ta = document.createElement("textarea");
        ta.rows = 3; ta.dataset.key = key; ta.value = value;
        card.appendChild(ta);
      } else {
        const input = document.createElement("input");
        input.type = "text"; input.dataset.key = key; input.value = value;
        card.appendChild(input);
      }
    });
    container.appendChild(card);
  });
}

function collectValues() {
  const values = {};
  document.querySelectorAll("[data-key]").forEach((el) => { values[el.dataset.key] = el.value; });
  return values;
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === `panel-${name}`));
  if (name === "submissions") loadSubmissions();
}

function setFilter(type) {
  currentFilter = type;
  document.querySelectorAll("#subFilters button").forEach((b) => b.classList.toggle("active", b.dataset.filter === type));
  renderSubmissions();
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s == null ? "" : s;
  return div.innerHTML;
}

function renderSubmissions() {
  const list = document.getElementById("subList");
  const filtered = currentFilter === "all" ? allSubmissions : allSubmissions.filter((s) => s.type === currentFilter);
  document.getElementById("subCount").textContent = allSubmissions.length ? `(${allSubmissions.length})` : "";

  if (!filtered.length) {
    list.innerHTML = `<p class="sub-empty">No ${currentFilter === "all" ? "" : currentFilter + " "}submissions yet.</p>`;
    return;
  }

  list.innerHTML = filtered.map((s) => {
    const date = new Date(s.created_at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    const rows = [];
    if (s.name) rows.push(`<div class="sub-row"><b>Name:</b>${escapeHtml(s.name)}</div>`);
    rows.push(`<div class="sub-row"><b>Email:</b>${escapeHtml(s.email)}</div>`);
    if (s.company) rows.push(`<div class="sub-row"><b>Company:</b>${escapeHtml(s.company)}</div>`);
    if (s.phone) rows.push(`<div class="sub-row"><b>Phone:</b>${escapeHtml(s.phone)}</div>`);
    if (s.volume) rows.push(`<div class="sub-row"><b>Est. volume:</b>${escapeHtml(s.volume)}</div>`);
    if (s.message) rows.push(`<div class="sub-row"><b>Message:</b>${escapeHtml(s.message)}</div>`);
    return `<div class="sub-item">
      <div class="sub-item-top">
        <div><span class="sub-badge" data-type="${s.type}">${s.type}</span></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="sub-date">${date}</span>
          <button class="sub-del" onclick="deleteSubmission(${s.id})">Delete</button>
        </div>
      </div>
      ${rows.join("")}
    </div>`;
  }).join("");
}

async function loadSubmissions() {
  try {
    const res = await fetch(`${API_BASE}/api/admin/submissions`, { headers: { Authorization: `Bearer ${token}` } });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    allSubmissions = json.data;
    renderSubmissions();
  } catch (err) {
    document.getElementById("subList").innerHTML = `<p class="sub-empty">${escapeHtml(err.message || "Failed to load submissions")}</p>`;
  }
}

async function deleteSubmission(id) {
  if (!confirm("Delete this submission? This can't be undone.")) return;
  await fetch(`${API_BASE}/api/admin/submissions/${id}`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` } });
  allSubmissions = allSubmissions.filter((s) => s.id !== id);
  renderSubmissions();
}

async function loadAndShow() {
  const res = await fetch(`${API_BASE}/api/content`);
  const json = await res.json();
  if (json.success) renderFields(json.data);
  loadSubmissions();
}

async function login() {
  const username = document.getElementById("loginUser").value;
  const password = document.getElementById("loginPass").value;
  const status = document.getElementById("loginStatus");
  status.textContent = "Logging in…"; status.removeAttribute("data-s");
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    token = json.token;
    localStorage.setItem("ikeda-admin-token", token);
    showApp();
  } catch (err) {
    status.textContent = err.message || "Login failed";
    status.dataset.s = "err";
  }
}

function logout() {
  localStorage.removeItem("ikeda-admin-token");
  token = null;
  document.getElementById("appView").style.display = "none";
  document.getElementById("loginView").style.display = "block";
}

async function showApp() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("appView").style.display = "block";
  await loadAndShow();
}

async function saveAll() {
  const status = document.getElementById("saveStatus");
  status.textContent = "Saving…"; status.removeAttribute("data-s");
  try {
    const res = await fetch(`${API_BASE}/api/admin/content`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(collectValues()),
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    status.textContent = "Saved — live on the homepage now.";
    status.dataset.s = "ok";
  } catch (err) {
    status.textContent = err.message || "Save failed";
    status.dataset.s = "err";
  }
}

async function changePassword() {
  const currentPassword = document.getElementById("curPass").value;
  const newPassword = document.getElementById("newPass").value;
  const status = document.getElementById("pwStatus");
  status.textContent = "Updating…"; status.removeAttribute("data-s");
  try {
    const res = await fetch(`${API_BASE}/api/admin/change-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ currentPassword, newPassword }),
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    status.textContent = "Password updated.";
    status.dataset.s = "ok";
    document.getElementById("curPass").value = "";
    document.getElementById("newPass").value = "";
  } catch (err) {
    status.textContent = err.message || "Failed to update password";
    status.dataset.s = "err";
  }
}

// If a saved session exists, verify it still works before skipping login.
(async function init() {
  if (!token) return;
  try {
    const res = await fetch(`${API_BASE}/api/admin/me`, { headers: { Authorization: `Bearer ${token}` } });
    const json = await res.json();
    if (json.success) { showApp(); return; }
  } catch {}
  logout();
})();
</script>
</body>
</html>
